apiVersion: apps/v1
kind: Deployment

metadata:
  name: chessai-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: chessai

  template:
    metadata:
      labels:
        app: chessai

    spec:
      containers:
      - name: chessai
        image: rushi6257/chessai:v1

        ports:
        - containerPort: 8501
